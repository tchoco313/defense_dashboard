[server]
headless = true

[browser]
gatherUsageStats = false

# 라이트 테마 — Streamlit 기본 위젯 색. 본문 글꼴(Pretendard)과 화면 디자인은 dashboard/static/ CSS · dashboard/kdesign.py 가 정한다.
[theme]
base = "light"
primaryColor = "#173f82"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f2f6fb"
textColor = "#14213a"
borderColor = "#d7e0ec"
font = "IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif"
baseRadius = "6px"
showWidgetBorder = true

# 오류 표시 — 예외 메시지에 RDS 호스트명이 섞일 수 있어 브라우저에는 예외 유형만 보인다(전체 메시지·트레이스백은 콘솔).
# 로컬 디버깅: 환경변수 STREAMLIT_CLIENT_SHOW_ERROR_DETAILS=full 이 이 값보다 우선한다.
[client]
showErrorDetails = "type"
